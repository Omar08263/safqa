# Security updates are on (repo setting). Version updates are kept small and grouped so the
# autonomous agents aren't flooded with PRs.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: sunday, time: "04:00", timezone: Africa/Cairo }
    open-pull-requests-limit: 2
    groups: { actions: { patterns: ["*"] } }
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: sunday, time: "04:00", timezone: Africa/Cairo }
    open-pull-requests-limit: 3
    groups:
      minor-and-patch: { update-types: [minor, patch] }
