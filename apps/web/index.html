<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <script>
      // Clean URLs + capture Google's implicit-flow fragment before the router boots.
      (() => {
        var h = location.hash || '';
        // Old links: /index.html#/login → /login (see src/lib/clean-url.ts).
        if (h.charAt(1) === '/') { history.replaceState(null, '', h.slice(1)); return; }
        if (/\/index\.html$/.test(location.pathname)) history.replaceState(null, '', location.pathname.replace(/index\.html$/, '') + location.search + h);
        if (h.indexOf('id_token=') === -1 && h.indexOf('error=') === -1) return;
        // Admin app sign-in (state "admin.*") goes on to the admin app; see src/lib/admin-bounce.ts.
        if (/(^#|&)state=admin\./.test(h)) { location.replace('https://safqa-admin.pages.dev/' + h); return; }
        try { sessionStorage.setItem('safqa.google.oauth.pending', h); } catch {}
        history.replaceState(null, '', location.pathname + location.search);
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#c9840a" />
    <meta name="description" content="صفقة — تتبع أسعار المتاجر في مصر واكشف الخصم المضخّم." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="صفقة Safqa — اعرف السعر العادل قبل ما تدفع" />
    <meta property="og:description" content="تتبّع أسعار بي.تك وكيمو وكمبيومارتس وراية وجوميا وغيرهم، اكشف الخصم المضخّم، وتنبيهات لحظية." />
    <meta property="og:image" content="https://safqaeg.pages.dev/brand/og-image.png" />
    <meta property="og:url" content="https://safqaeg.pages.dev/" />
    <link rel="canonical" href="https://safqaeg.pages.dev/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://safqaeg.pages.dev/brand/og-image.png" />

    <link rel="preload" as="font" type="font/woff2" href="/fonts/ibm-plex-sans-arabic/ibm-plex-sans-arabic-400.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/ibm-plex-sans-arabic/ibm-plex-sans-arabic-700.woff2" crossorigin />
    <link rel="stylesheet" href="/fonts.css" />
    <script src="/appearance.js"></script>
    <title>صفقة Safqa — ذكاء الأسعار في مصر</title>
  </head>
  <body>
    <div id="root">
      <!-- Instant first paint; React replaces this as soon as it mounts. -->
      <div style="min-height:100vh;display:grid;place-items:center;font-family:'IBM Plex Sans Arabic',system-ui,sans-serif">
        <div style="text-align:center">
          <img src="/brand/icon-192.png" alt="صفقة" width="72" height="72" style="border-radius:20px;box-shadow:0 18px 40px -18px rgb(201 132 10 / .6)" />
          <p style="margin:14px 0 0;font-weight:700;font-size:20px;color:#1c1915">صفقة</p>
          <p style="margin:4px 0 0;font-size:13px;color:#6e665b">بنجيب أحدث الأسعار…</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
