<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <script>
      // Capture Google's implicit-flow fragment before the hash router boots.
      (() => {
        var h = location.hash || '';
        if (h.charAt(1) === '/') return;
        if (h.indexOf('id_token=') === -1 && h.indexOf('error=') === -1) return;
        try { sessionStorage.setItem('safqa.google.oauth.pending', h); } catch {}
        history.replaceState(null, '', location.pathname + location.search);
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#c9840a" />

    <meta property="og:description" content="تتبّع أسعار نون وأمازون مصر وبي.تك، اكشف الخصم المضخّم، وتنبيهات لحظية." />
