<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <script>
      // Clean URLs + capture Google's implicit-flow fragment before the router boots.
      (() => {
        var h = location.hash || '';
        // Old links: /index.html#/login → /login (see src/lib/clean-url.ts).
        if (h.charAt(1) === '/') { history.replaceState(null, '', h.slice(1)); return; }
        if (/\/index\.html$/.test(location.pathname)) history.replaceState(null, '', location.pathname.replace(/index\.html$/, '') + location.search + h);
        if (h.indexOf('id_token=') === -1 && h.indexOf('error=') === -1) return;
        // Admin app sign-in (state "admin.*") goes on to the admin app; see src/lib/admin-bounce.ts.
        if (/(^#|&)state=admin\./.test(h)) { location.replace('https://safqa-admin.pages.dev/' + h); return; }
        try { sessionStorage.setItem('safqa.google.oauth.pending', h); } catch {}
        history.replaceState(null, '', location.pathname + location.search);
      })();
    </script>

    <meta name="viewport" content="width=device-width, initial-scale=1" />
