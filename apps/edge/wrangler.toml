name = "safqa-api"
main = "src/index.ts"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[ai]
binding = "AI"

[[d1_databases]]
binding = "DB"
database_name = "safqa"
database_id = "63fe0a16-276c-493c-9889-d7c971422783"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "KV"
id = "d7e02776ec5045bfbc176385cac1a876"

[triggers]
# Every 10 min: appeals, Telegram outbox, hourly cleanup, daily 9:30 Cairo digest.
# Minutes 5,15,25…: v5 ingestion agents only (feed poller + adaptive recrawl + smart notifications), own query budget.
# Minutes 2,17,32,47: العقل الرئيسي (master AI orchestrator, src/brain), own query budget.
crons = ["*/10 * * * *", "5-55/10 * * * *", "2,17,32,47 * * * *"]

[vars]
ALLOWED_ORIGINS = "https://safqaeg.pages.dev,https://preview.safqaeg.pages.dev,https://safqa-eg-safqa.static.hf.space,https://safqa-admin.pages.dev,http://localhost:47321,http://localhost:5173,capacitor://localhost,https://localhost"
GOOGLE_CLIENT_ID = "700154178904-k0hi0kp5v19m775u8t1bt6m6mnfhrghc.apps.googleusercontent.com"
INSTAPAY_ADDRESS = "om3r0@instapay"
INSTAPAY_LINK = "https://ipn.eg/S/om3r0/instapay/9xdBaB"
SITE_URL = "https://safqaeg.pages.dev"
CHAT_MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
CHAT_FALLBACK_MODEL = "@cf/meta/llama-4-scout-17b-16e-instruct"
VISION_MODEL = "@cf/meta/llama-4-scout-17b-16e-instruct"
AI_DAILY_CALL_BUDGET = "180"
# Secrets (wrangler secret put): JWT_SECRET, PUSH_SECRET, ADMIN_EMAILS, TELEGRAM_BOT_TOKEN (optional)

# Shared web modules (rules, agents, moderation) read Vite env at import time.
[define]
"import.meta.env" = "{\"VITE_DEMO_MODE\":\"edge\"}"

# Workers Analytics Engine (free: 100k data points/day, 3-month retention): raw price observations
# (every check, changed or not) + write-budget telemetry. Separate quota from D1 writes.
# One-time: enable Analytics Engine at dash.cloudflare.com → Workers → Analytics Engine (free), then uncomment.
# [[analytics_engine_datasets]]
# binding = "OBS"
# dataset = "safqa_obs"
