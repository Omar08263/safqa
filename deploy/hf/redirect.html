<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>صفقة نقلت لعنوان جديد — safqaeg.pages.dev</title>
<link rel="canonical" href="https://safqaeg.pages.dev/">
<meta name="robots" content="noindex">
<script>
  // Safqa moved to https://safqaeg.pages.dev (clean URLs, faster, no index.html).
  // Old links keep working: /index.html#/product/x → /product/x.
  (function () {
    var NEW = 'https://safqaeg.pages.dev';
    var h = location.hash || '';
    // Admin app Google sign-in still returns here (registered redirect URI).
    if (/(^#|&)state=admin\./.test(h)) { location.replace('https://safqa-admin.pages.dev/' + h); return; }
    var path = '/';
    if (h.charAt(1) === '/') { path = h.slice(1); h = ''; }
    else if (/id_token=|error=/.test(h)) { path = '/login'; h = ''; }
    var q = location.search || '';
    location.replace(NEW + path + (path.indexOf('?') === -1 ? q : '') + h);
  })();
</script>
