# Safqa Render Blueprint (free-tier demo).
#
# After this file is on the GitHub default branch, apply it at:
#   https://dashboard.render.com/blueprint/new?repo=https://github.com/FY881/safqa
#
# You need a free Render account with GitHub connected. Do not add a payment
# method unless you later choose to upgrade. This file uses only free plans.
#
# Free-tier notes (https://render.com/docs/free.md, retrieved 2026-11-18):
# - Free web services spin down after 15 minutes idle; the next request takes
#   about a minute to wake. Workspace limit: 750 Free instance hours/month.
# - Free Postgres: 1 GB, one active instance per workspace, expires 30 days
#   after creation (14-day grace period to upgrade, then the data is deleted).
#   No backups. TimescaleDB is not available; migrate() already falls back to
#   a plain price_points table.
# - Free Key Value exists (one per workspace) but is in-memory only; data is
#   lost on restart. The API already runs without Redis (catalog and demo
#   login work; GET /api/events returns 503 if REDIS_URL is missing).
# - Background workers are not available on the free plan, so the crawler
#   worker is omitted. The public demo is seeded on API boot (SEED_ON_BOOT)
#   and does not need the worker. To add it later on a paid plan, use the
#   same Dockerfile with:
#     type: worker
#     runtime: docker
#     dockerCommand: pnpm --filter @safqa/worker exec tsx src/index.ts
# - Static sites are free (they count against included bandwidth and build
#   minutes). They are not on the private network, so the browser calls the
#   API at its public URL (VITE_API_URL <- RENDER_EXTERNAL_URL).
#
# LLM_PROVIDER=mock so no paid model keys are required.
# AUTH_SECRET is generated by Render and is not stored in this repo.

databases:
  - name: safqa-db
    plan: free
    databaseName: safqa
    user: safqa
    region: frankfurt
    postgresMajorVersion: "16"
    ipAllowList: [] # API connects over Render's private network

services:
  - type: keyvalue
    name: safqa-redis
    plan: free
    region: frankfurt
    maxmemoryPolicy: allkeys-lru
    ipAllowList: [] # internal access only; free instances have no persistence

  - type: web
    name: safqa-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: safqa-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: safqa-redis
          type: keyvalue
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: LLM_PROVIDER
        value: mock
      - key: SEED_ON_BOOT
        value: "true"
      - key: API_PUBLIC_URL
        fromService:
          name: safqa-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: WEB_ORIGIN
        fromService:
          name: safqa-web
          type: web
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: safqa-web
    runtime: static
    buildCommand: corepack enable && corepack prepare pnpm@10.33.4 --activate && pnpm install --frozen-lockfile && pnpm --filter @safqa/web build
    staticPublishPath: ./apps/web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: SKIP_INSTALL_DEPS
        value: "true"
      - key: VITE_API_URL
        fromService:
          name: safqa-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
